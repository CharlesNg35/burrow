name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ZIG_VERSION: 0.17.0
  ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --features admin-test-hooks -- -D warnings
      - name: Lint the build without the web proxy
        run: cargo clippy --locked -p burrow --all-targets --no-default-features -- -D warnings
      - run: cargo xtask arch-check
      - run: cargo test --locked -p xtask
      - name: Format and lint the fuzz targets
        working-directory: fuzz
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: cargo fmt --check && cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Allow the private network namespace that a test sets up
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: cargo test --locked
      - name: Test the web proxy crate
        run: cargo test --locked -p burrow-web
      - name: Integration tests over WebSocket
        env:
          BURROW_TEST_TRANSPORT: ws
        run: cargo test --locked --test integration --test reconnect --test visit --test ranges --test failover --test socks --test proxy_protocol --test sources --test admin --test admin_keepalive --test self_target --test fetch --test web
      - name: Install and run as a systemd service
        env:
          BURROW_E2E_PROFILE: dev
        run: bash tests/e2e/service.sh

  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked
      - run: cargo test --locked
      - name: Install and run as a launchd service
        if: runner.os == 'macOS'
        env:
          BURROW_E2E_PROFILE: dev
        run: bash tests/e2e/service.sh
      - name: Install and run as a Windows service
        if: runner.os == 'Windows'
        env:
          BURROW_E2E_PROFILE: dev
        shell: pwsh
        run: ./tests/e2e/service.ps1

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: wasm32
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-binstall
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: ui-tools-${{ hashFiles('xtask/src/tools.rs', 'Cargo.lock') }}
      - run: cargo xtask tools --no-chrome
      - run: cargo clippy --locked -p burrow-admin-ui -p burrow-ui-kit -p burrow-config --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --locked -p burrow-config -p burrow-admin-logic -p burrow-admin-proto -p burrow-syntax -p burrow-ui-kit -p burrow-admin-ui
      - run: cargo xtask ui --release
      - run: cargo xtask size --budget
      - name: The built UI is embedded
        env:
          BURROW_ADMIN_UI_REQUIRE: "1"
        run: |
          cargo build --locked
          info=$(./target/debug/burrow admin --ui-info)
          echo "$info"
          manifest=$(sed -n 's/^manifest //p' <<<"$info")
          [ "$manifest" != "placeholder" ] && [ -n "$manifest" ]
      - name: The real UI files are served safely
        env:
          BURROW_ADMIN_UI_REQUIRE: "1"
        run: cargo test --locked --test admin the_local_page_is_only_served_to_this_machine
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-ui-dist
          path: crates/burrow-admin-ui/dist
          if-no-files-found: error

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit
      - run: cargo audit
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [handshake, frames, config, update, patch, syntax_parsers, socks_udp_header, sni_peek, proxy_header]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly
        working-directory: fuzz
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - name: Toolchain versions
        working-directory: fuzz
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: rustc --version && cargo --version && cargo fuzz --version
      - name: Fuzz ${{ matrix.target }} for 30 seconds
        working-directory: fuzz
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: |
          mkdir -p corpus/${{ matrix.target }}
          seeds=$(ls -d seeds/${{ matrix.target }} 2>/dev/null || true)
          cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} corpus/${{ matrix.target }} $seeds -- -max_total_time=30 -max_len=4096
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked --release
      - run: ./target/release/burrow version

  cross:
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - arm-unknown-linux-musleabihf
          - riscv64gc-unknown-linux-musl
          - x86_64-pc-windows-gnu
          - aarch64-pc-windows-gnullvm
          - x86_64-unknown-freebsd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Install zig
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          echo "${ZIG_SHA256}  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/zig" && tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-zigbuild@0.23.4
      - run: cargo zigbuild --locked --target ${{ matrix.target }}
      - name: Run the built binary
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: ./target/${{ matrix.target }}/debug/burrow version
