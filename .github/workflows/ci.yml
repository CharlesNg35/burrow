name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ZIG_VERSION: 0.17.0
  ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --features admin-test-hooks -- -D warnings
      - run: cargo clippy --locked -p burrow-web --all-targets --features admin-test-hooks -- -D warnings
      - name: Lint the build without the web proxy
        run: cargo clippy --locked -p burrow --all-targets --no-default-features -- -D warnings
      - run: cargo xtask arch-check
      - run: cargo test --locked -p xtask
      - name: Format and lint the fuzz targets
        working-directory: fuzz
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: cargo fmt --check && cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Allow the private network namespace that a test sets up
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: cargo test --locked
      - name: Test the web proxy crate
        run: cargo test --locked -p burrow-web
      - name: Test the library in the build without the web proxy
        run: cargo test --locked -p burrow --no-default-features --lib
      - name: Integration tests over WebSocket
        env:
          BURROW_TEST_TRANSPORT: ws
        run: cargo test --locked --test integration --test reconnect --test visit --test ranges --test failover --test socks --test proxy_protocol --test sources --test admin --test admin_keepalive --test self_target --test fetch --test web
      - name: Install and run as a systemd service
        env:
          BURROW_E2E_PROFILE: dev
        run: bash tests/e2e/service.sh

  pebble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Pull Pebble 2.10.1 and pebble-challtestsrv 2.10.1
        run: docker pull ghcr.io/letsencrypt/pebble:2.10.1@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199 && docker pull ghcr.io/letsencrypt/pebble-challtestsrv:2.10.1@sha256:12ce21884def456bcf9786542113949e1f19dc7738d2c70e156c2d0c38a1405b
      - name: Certificates from Let's Encrypt's test server, Pebble in strict mode, then with half of all nonces refused
        env:
          BURROW_PEBBLE: "1"
        run: cargo test --locked -p burrow-web --features admin-test-hooks --test acme -- --nocapture
      - name: Pull BIND 9.20 and acme-dns 2.0.2
        run: docker pull internetsystemsconsortium/bind9:9.20@sha256:66092edb53c081fa11b1fa8219e99065b0f497cb38f568ba789702a4c10e2590 && docker pull joohoi/acme-dns:v2.0.2@sha256:8d327df58b1c9f6361c76734f9761a108fa4f12cf7ca94440a0404a28f75de62
      - name: DNS checks through BIND, a real acme-dns and a mocked Cloudflare API, with Pebble
        env:
          BURROW_PEBBLE: "1"
        run: cargo test --locked -p burrow-web --features admin-test-hooks --test dns01 -- --nocapture

  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-binstall
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: compat-tools-${{ hashFiles('xtask/src/tools.rs', 'xtask/src/compat.rs', 'Cargo.lock') }}
      - name: The UI build tools and the pinned Chrome for Testing
        run: cargo xtask tools
      - run: cargo xtask ui
      - name: Allow the user namespaces Chrome's sandbox needs
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Tunnels, burrow mcp and the admin UI both ways against the released v0.1.2 binary, fetched by its pinned SHA-256
        run: cargo xtask compat

  h2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Fetch h2spec 2.6.0, checked by sha256
        run: |
          curl -sSL -o h2spec.tar.gz https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz
          echo "157ee0de702e01ad40e752dbf074b366027e550c8e7504f9450da2809e279318  h2spec.tar.gz" | sha256sum -c -
          tar xzf h2spec.tar.gz h2spec
      - name: h2spec against the HTTPS listener (non-strict)
        env:
          BURROW_H2SPEC: ${{ github.workspace }}/h2spec
        run: cargo test --locked -p burrow-web --test h2 conformance -- --nocapture
      - name: The stalled-stream watchdog and server memory per connection under load, over real HTTP/2 connections
        env:
          BURROW_H2_SLOW: "1"
        run: "cargo test --locked -p burrow-web --test h2 -- stall:: load:: --nocapture"
      - name: Pull Go 1.25 for the gRPC interop server
        run: docker pull golang:1.25-alpine@sha256:1ae0735f00daffa3aaf1363a5184c0d2dc55c78e3db4ec70241cdac97bf84b59
      - name: gRPC through burrow to the grpc-go 1.84.0 interop server, over h2c and over TLS
        env:
          BURROW_GRPC: "1"
        run: cargo test --locked -p burrow-web --test grpc -- --nocapture

  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked
      - run: cargo test --locked
      - name: Test the web proxy crate
        run: cargo test --locked -p burrow-web
      - name: Install and run as a launchd service
        if: runner.os == 'macOS'
        env:
          BURROW_E2E_PROFILE: dev
        run: bash tests/e2e/service.sh
      - name: Install and run as a Windows service
        if: runner.os == 'Windows'
        env:
          BURROW_E2E_PROFILE: dev
        shell: pwsh
        run: ./tests/e2e/service.ps1

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: wasm32
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-binstall
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: ui-tools-${{ hashFiles('xtask/src/tools.rs', 'Cargo.lock') }}
      - run: cargo xtask tools --no-chrome
      - run: cargo clippy --locked -p burrow-admin-ui -p burrow-ui-kit -p burrow-config --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --locked -p burrow-config -p burrow-admin-logic -p burrow-admin-proto -p burrow-syntax -p burrow-ui-kit -p burrow-admin-ui
      - run: cargo xtask ui --release
      - run: cargo xtask size --budget
      - name: The built UI is embedded
        env:
          BURROW_ADMIN_UI_REQUIRE: "1"
        run: |
          cargo build --locked
          info=$(./target/debug/burrow admin --ui-info)
          echo "$info"
          manifest=$(sed -n 's/^manifest //p' <<<"$info")
          [ "$manifest" != "placeholder" ] && [ -n "$manifest" ]
      - name: The real UI files are served safely
        env:
          BURROW_ADMIN_UI_REQUIRE: "1"
        run: cargo test --locked --test admin the_local_page_is_only_served_to_this_machine
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-ui-dist
          path: crates/burrow-admin-ui/dist
          if-no-files-found: error
          retention-days: 1

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit
      - run: cargo audit
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [handshake, frames, config, update, patch, syntax_parsers, socks_udp_header, sni_peek, proxy_header, acme_meta, http_edge, host_header, path_normalize, basic_auth_header]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly
        working-directory: fuzz
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - name: Toolchain versions
        working-directory: fuzz
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: rustc --version && cargo --version && cargo fuzz --version
      - name: Fuzz ${{ matrix.target }} for 30 seconds
        working-directory: fuzz
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=30 -max_len=4096
      - name: Print the crashing inputs, base64, so they outlive the run's artifacts
        if: failure()
        run: |
          for f in fuzz/artifacts/${{ matrix.target }}/*; do
            [ -f "$f" ] || continue
            echo "== $f"
            base64 -w0 "$f"
            echo
          done
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
          retention-days: 1

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked --release
      - run: ./target/release/burrow version

  cross:
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - arm-unknown-linux-musleabihf
          - riscv64gc-unknown-linux-musl
          - x86_64-pc-windows-gnu
          - aarch64-pc-windows-gnullvm
          - x86_64-unknown-freebsd
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Install zig
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          echo "${ZIG_SHA256}  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/zig" && tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-zigbuild@0.23.4
      - run: cargo zigbuild --locked --target ${{ matrix.target }}
      - name: Build the tests for FreeBSD, warnings as errors (no FreeBSD runner, so they only compile)
        if: matrix.target == 'x86_64-unknown-freebsd'
        env:
          RUSTFLAGS: -D warnings
        run: cargo zigbuild --locked --target x86_64-unknown-freebsd -p burrow -p burrow-web --tests
      - name: Run the built binary
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: ./target/${{ matrix.target }}/debug/burrow version

  cleanup:
    name: delete this run's artifacts
    needs: [ui, fuzz]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: "*"
          failOnError: false
