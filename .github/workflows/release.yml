name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
  PRERELEASE: ${{ contains(github.ref_name, '-') && 'true' || 'false' }}
  ZIG_VERSION: 0.17.0
  ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches Cargo.toml
        if: env.PUBLISH == 'true'
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_NAME#v}" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version in Cargo.toml ($crate)"
            exit 1
          fi

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup target add wasm32-unknown-unknown
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-binstall
      - run: cargo xtask tools --no-chrome
      - run: cargo xtask ui --release
      - run: cargo xtask size --budget
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-ui-dist
          path: crates/burrow-admin-ui/dist
          if-no-files-found: error
          retention-days: 1

  binaries:
    needs: [version, ui]
    name: build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { asset: linux-amd64, target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true, runs: true }
          - { asset: linux-arm64, target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { asset: macos-arm64, target: aarch64-apple-darwin, os: macos-latest, runs: true }
          - { asset: macos-amd64, target: x86_64-apple-darwin, os: macos-latest }
          - { asset: windows-amd64, target: x86_64-pc-windows-gnu, os: ubuntu-latest, zig: true }
          - { asset: windows-arm64, target: aarch64-pc-windows-gnullvm, os: ubuntu-latest, zig: true }
          - { asset: linux-armv7, target: armv7-unknown-linux-musleabihf, os: ubuntu-latest, zig: true }
          - { asset: linux-armv6, target: arm-unknown-linux-musleabihf, os: ubuntu-latest, zig: true }
          - { asset: linux-riscv64, target: riscv64gc-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { asset: freebsd-amd64, target: x86_64-unknown-freebsd, os: ubuntu-latest, zig: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: admin-ui-dist
          path: ${{ runner.temp }}/admin-ui
      - name: Embed the admin UI built once
        shell: bash
        run: |
          echo "BURROW_ADMIN_UI_DIST=$RUNNER_TEMP/admin-ui" >> "$GITHUB_ENV"
          echo "BURROW_ADMIN_UI_REQUIRE=1" >> "$GITHUB_ENV"
      - name: Install zig
        if: matrix.zig
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          echo "${ZIG_SHA256}  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/zig" && tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - if: matrix.zig
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-zigbuild@0.23.4
      - name: Build (zig cross-compile)
        if: matrix.zig
        env:
          AARCH64_UNKNOWN_LINUX_MUSL_JEMALLOC_SYS_WITH_LG_PAGE: "16"
        run: cargo zigbuild --locked --release --target ${{ matrix.target }}
      - name: Build (native)
        if: ${{ !matrix.zig }}
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Sign (macOS)
        if: contains(matrix.target, 'apple-darwin')
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          bin="target/${{ matrix.target }}/release/burrow"
          if [ -z "$MACOS_CERTIFICATE" ]; then
            if [ "$PUBLISH" = "true" ]; then
              echo "::error::MACOS_CERTIFICATE is not set: a release must be signed, or the macOS firewall asks again after every update"
              exit 1
            fi
            echo "::warning::MACOS_CERTIFICATE is not set: ad-hoc signature only"
            codesign --force --sign - --identifier com.github.charlesng35.burrow "$bin"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          p12="$RUNNER_TEMP/signing.p12"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$p12"
          identity="$(security find-identity -p codesigning "$keychain" | awk '/^ *[0-9]+\)/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERTIFICATE holds no code-signing identity"
            exit 1
          fi
          codesign --force --timestamp --options runtime --identifier com.github.charlesng35.burrow --sign "$identity" --keychain "$keychain" "$bin"
          codesign --verify --strict --verbose=2 "$bin"
          requirement="$(codesign --display --requirements - "$bin" 2>&1)"
          echo "$requirement"
          grep -q 'identifier "com.github.charlesng35.burrow" and certificate root = H"' <<<"$requirement"
          security delete-keychain "$keychain"
      - name: Run the built binary
        if: matrix.runs
        shell: bash
        run: |
          ./target/${{ matrix.target }}/release/burrow version
          info=$(./target/${{ matrix.target }}/release/burrow admin --ui-info)
          echo "$info"
          grep -qx 'test_hooks: false' <<<"$info"
          manifest=$(sed -n 's/^manifest //p' <<<"$info")
          [ "$manifest" != "placeholder" ] && [ -n "$manifest" ]
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || version="0.0.0-dev.${GITHUB_SHA::7}"
          name="burrow-${version}-${{ matrix.asset }}"
          mkdir -p "dist/$name"
          cp LICENSE "dist/$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/burrow.exe" "dist/$name/"
            (cd dist && python3 -c 'import shutil, sys; shutil.make_archive(sys.argv[1], "zip", ".", sys.argv[1])' "$name")
          else
            cp "target/${{ matrix.target }}/release/burrow" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ "$PUBLISH" = "true" ] && [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          cat notes.md
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.PUBLISH == 'true'
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: env.PUBLISH == 'true'
        with:
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: ${{ env.PRERELEASE == 'true' }}
          make_latest: ${{ env.PRERELEASE == 'true' && 'false' || 'true' }}

  image:
    needs: [publish, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: admin-ui-dist
          path: crates/burrow-admin-ui/dist
      - name: Lowercase image owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH == 'true' && env.HAS_DOCKERHUB == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ env.OWNER }}/burrow
            ${{ env.HAS_DOCKERHUB == 'true' && format('docker.io/{0}/burrow', secrets.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ env.PUBLISH == 'true' && env.PRERELEASE != 'true' }}
            type=sha,enable=${{ env.PUBLISH != 'true' }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.PUBLISH == 'true'
        with:
          subject-name: ghcr.io/${{ env.OWNER }}/burrow
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  cleanup:
    name: delete this run's artifacts
    needs: [version, ui, binaries, publish, image]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: "*"
          failOnError: false
