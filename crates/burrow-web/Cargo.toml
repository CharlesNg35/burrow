[package]
name = "burrow-web"
version = "0.1.2"
edition = "2024"
description = "The burrow web proxy: one HTTPS port for passthrough sites and the tunnel"
license = "MIT"
publish = false

[dependencies]
base64 = "0.23.1"
burrow-syntax = { path = "../burrow-syntax" }
bytes = "1.12.1"
hickory-proto = { version = "0.26.3", default-features = false, features = ["std", "dnssec-ring"] }
http = "1.5.0"
http-body-util = "0.1.5"
httpdate = "1.0.3"
instant-acme = { version = "=0.8.5", default-features = false, features = ["ring", "rcgen", "time"] }
hyper = { version = "1.12.0", default-features = false, features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
ppp = "2.3.0"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "crypto"] }
resolv-conf = "0.7.6"
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = "0.6.5"
tokio = { version = "1.53.3", features = ["net", "io-util", "time", "sync", "rt", "macros", "process"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging", "tls12"] }
tracing = "0.1.44"
webpki-roots = "1.0.10"
zeroize = "1.9.1"
x509-cert = { version = "0.3.0", default-features = false, features = ["hazmat"] }
webpki = { package = "rustls-webpki", version = "0.103.16", default-features = false, features = ["alloc"] }

[target.'cfg(windows)'.dependencies]
ipconfig = { version = "0.3.4", default-features = false }

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
tempfile = "3.27.0"
time = "0.3.55"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "test-util", "process"] }
tokio-websockets = { version = "0.13.3", default-features = false, features = ["client", "server", "ring", "getrandom"] }

[lints]
workspace = true
