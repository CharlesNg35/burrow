[package]
name = "burrow-config"
version = "0.1.1"
edition = "2024"
description = "The burrow config model, shared by the server and the admin UI"
license = "MIT"
publish = false

[dependencies]
burrow-admin-derive = { path = "../burrow-admin-derive" }
burrow-admin-proto = { path = "../burrow-admin-proto" }
schemars = { version = "1.2.3", optional = true }
serde = { version = "1.0.229", features = ["derive"] }

[features]
json-schema = ["dep:schemars", "burrow-admin-proto/json-schema"]
