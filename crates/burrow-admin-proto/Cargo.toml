[package]
name = "burrow-admin-proto"
version = "0.1.2"
edition = "2024"
description = "Wire and schema types of the burrow admin protocol"
license = "MIT"
publish = false

[dependencies]
schemars = { version = "1.2.3", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[features]
json-schema = ["dep:schemars"]

[lints]
workspace = true
