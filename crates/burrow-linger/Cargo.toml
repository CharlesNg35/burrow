[package]
name = "burrow-linger"
version = "0.2.0"
edition = "2024"
description = "Lingering close for burrow's HTTP/1 servers, so an early answer is not lost to a TCP reset"
license = "MIT"
publish = false

[features]
probe = ["tokio/net", "tokio/rt"]

[dependencies]
hyper = { version = "1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
tokio = { version = "1.53.3", features = ["io-util", "time"] }

[dev-dependencies]
bytes = "1.12.1"
http-body-util = "0.1.5"
tokio = { version = "1.53.3", features = ["net", "rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true
