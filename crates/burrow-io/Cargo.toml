[package]
name = "burrow-io"
version = "0.2.0"
edition = "2024"
description = "In-memory byte pipes shared by the burrow tunnel and web proxy"
license = "MIT"
publish = false

[dependencies]
bytes = "1.12.1"
tokio = { version = "1.53.3", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt", "macros", "io-util"] }

[lints]
workspace = true
