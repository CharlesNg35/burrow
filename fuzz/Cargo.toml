[package]
name = "burrow-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
burrow = { path = ".." }
burrow-config = { path = "../crates/burrow-config" }
burrow-syntax = { path = "../crates/burrow-syntax" }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt", "io-util"] }

[[bin]]
name = "handshake"
path = "fuzz_targets/handshake.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frames"
path = "fuzz_targets/frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "update"
path = "fuzz_targets/update.rs"
test = false
doc = false
bench = false

[[bin]]
name = "patch"
path = "fuzz_targets/patch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "syntax_parsers"
path = "fuzz_targets/syntax_parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "socks_udp_header"
path = "fuzz_targets/socks_udp_header.rs"
test = false
doc = false
bench = false
