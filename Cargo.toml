[package]
name = "burrow"
version = "0.2.0"
edition = "2024"
description = "Fast, secure, lightweight reverse tunnel"
license = "MIT"
repository = "https://github.com/charlesng35/burrow"
readme = "README.md"
keywords = ["tunnel", "nat", "reverse-proxy", "noise"]
categories = ["command-line-utilities", "network-programming"]
publish = false

[workspace]
members = [
    ".",
    "crates/burrow-syntax",
    "crates/burrow-io",
    "crates/burrow-config",
    "crates/burrow-admin-logic",
    "crates/burrow-admin-proto",
    "crates/burrow-admin-derive",
    "crates/burrow-ui-kit",
    "crates/burrow-admin-ui",
    "crates/burrow-web",
    "xtask",
]

[workspace.lints.clippy]
too_many_lines = "deny"

[lints]
workspace = true

[dependencies]
burrow-admin-proto = { path = "crates/burrow-admin-proto" }
burrow-config = { path = "crates/burrow-config", features = ["json-schema"] }
burrow-io = { path = "crates/burrow-io" }
burrow-web = { path = "crates/burrow-web", optional = true }
burrow-syntax = { path = "crates/burrow-syntax" }
aws-lc-rs = "1.19.0"
base64 = "0.23.1"
blake2 = "0.10.6"
dirs = "6"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
crossterm = { version = "0.29.0", default-features = false, features = ["events", "windows"] }
dunce = "1.0.5"
flate2 = "1.1.10"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
getrandom = "0.3.4"
hex = "0.4.3"
http = "1.5.0"
httparse = "1.10.1"
http-body-util = "0.1.5"
maxminddb = "0.32.0"
hyper = { version = "1.12.0", default-features = false, features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls", "aws-lc-rs", "webpki-roots"], optional = true }
notify = "8.2.0"
rmcp = { version = "3.7.0", default-features = false, features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
rpassword = { version = "7.5.4", optional = true }
pem = "4.0.0"
percent-encoding = "2.3.2"
saphyr-parser = "0.2.2"
schemars = "1.2.3"
rustls = { version = "0.23.46", default-features = false, features = ["prefer-post-quantum"] }
semver = "1.0.28"
shlex = "2.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.10.9"
snow = { version = "0.10.0", default-features = false, features = ["default-resolver-crypto", "std"] }
socket2 = "0.6.5"
strsim = "0.11.1"
subtle = "2.6.1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "signal", "macros", "fs"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
tokio-websockets = { version = "0.13.3", default-features = false, features = ["client", "server", "aws_lc_rs", "getrandom"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt", "ansi"] }
webpki-roots = "1.0.10"
which = "8.0.6"
zeroize = { version = "1.9.1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"
nix = { version = "0.31.3", default-features = false, features = ["user"] }
signal-hook = "0.3.18"
rustix = { version = "1.1.5", default-features = false, features = ["fs", "process", "std"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["net"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"

[target.'cfg(all(target_env = "musl", any(target_arch = "x86_64", target_arch = "aarch64", target_arch = "riscv64")))'.dependencies]
tikv-jemallocator = { version = "0.6", features = ["background_threads"] }

[target.'cfg(all(target_env = "musl", target_arch = "arm"))'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
burrow-io = { path = "crates/burrow-io", features = ["probe"] }
arbtest = "0.3"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash", "getrandom"] }
bcrypt = { version = "0.19.3", default-features = false, features = ["std"] }
burrow-admin-logic = { path = "crates/burrow-admin-logic" }
chromiumoxide = { version = "=0.9.1", default-features = false }
h2 = "0.4.20"
image = { version = "0.25.10", default-features = false, features = ["png"] }
insta = "1.49.0"
maxminddb-writer = "0.1.3"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "crypto"] }
rmcp = { version = "3.7.0", default-features = false, features = ["client", "transport-child-process"] }
tempfile = "3.27.0"
toml = "1.1.8"

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["pty", "std"] }

[build-dependencies]
blake2 = "0.10.6"
hex = "0.4.3"
serde_json = "1.0.154"

[features]
default = ["ring", "web"]
ring = ["snow/ring-accelerated"]
web = ["dep:burrow-web", "dep:rpassword", "dep:lettre"]
admin-test-hooks = ["burrow-web?/admin-test-hooks"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
strip = false

[profile.dev]
debug = "line-tables-only"

[profile.dev.package]
sha2.opt-level = 3
blake2.opt-level = 3
argon2.opt-level = 3
blowfish.opt-level = 3
curve25519-dalek.opt-level = 3
miniz_oxide.opt-level = 3
crc32fast.opt-level = 3

[[bench]]
name = "cipher"
harness = false
