[package]
name = "burrow"
version = "0.1.0"
edition = "2024"
description = "Fast, secure, lightweight reverse tunnel"
license = "MIT"
repository = "https://github.com/charlesng35/burrow"
readme = "README.md"
keywords = ["tunnel", "nat", "reverse-proxy", "noise"]
categories = ["command-line-utilities", "network-programming"]
publish = false

[dependencies]
base64 = "0.23.1"
blake2 = "0.10.6"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
getrandom = "0.3.4"
http = "1.5.0"
httparse = "1.10.1"
notify = "8.2.0"
saphyr-parser = "0.2.2"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
snow = { version = "0.10.0", default-features = false, features = ["default-resolver-crypto", "std"] }
socket2 = "0.6.5"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "signal", "macros", "fs"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-websockets = { version = "0.13.3", default-features = false, features = ["client", "server", "ring", "getrandom"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt", "ansi"] }
webpki-roots = "1.0.9"
zeroize = { version = "1.9.1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"

[dev-dependencies]
insta = "1.49.0"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "crypto"] }
tempfile = "3.27.0"

[features]
default = ["ring"]
ring = ["snow/ring-accelerated"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
strip = false

[[bench]]
name = "cipher"
harness = false
